<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Coding Reference Tool</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f4f7fa, #e9eef5);
      margin: 0;
      padding: 40px;
      text-align: center;
    }

    .intro {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-top: 50px;
    }

    .quote {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #0d3b66;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.15);
    }

    .intro img {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      transition: transform 0.3s ease;
    }

    .intro img:hover {
      transform: scale(1.05);
    }

    #current-date {
      margin-top: 10px;
      font-size: 22px;
      font-weight: 600;
      color: #7B2CBF;
      font-style: italic;
      letter-spacing: 1px;
      background: rgba(123, 44, 191, 0.08);
      padding: 10px 20px;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <div class="intro">
    
    <div class="quote">
      DOMINATE THE DAY BRIGHTWILDERS
    </div>

    <img src="Brightwild_Workable_1200x1200.png" alt="Brightwild Logo">

    <div id="current-date"></div>

  </div>

  <script>
    function updateDateTime() {
      const now = new Date();

      const dateOptions = {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      };

      const timeOptions = {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      };

      document.getElementById("current-date").innerHTML =
        `${now.toLocaleDateString(undefined, dateOptions)}<br>
         ${now.toLocaleTimeString(undefined, timeOptions)}`;
    }

    updateDateTime();
    setInterval(updateDateTime, 1000);
  </script>

</body>
</html>
